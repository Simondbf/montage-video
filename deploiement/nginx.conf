# Configuration nginx du site, installée par deploiement/nginx.sh.
# Ne pas modifier le fichier copié dans /etc/nginx : modifier celui-ci,
# puis relancer le script.

# HTTP : tout part vers HTTPS, sauf le dossier où certbot dépose les
# fichiers de vérification lors des renouvellements (méthode « webroot »).
server {
    listen 80;
    server_name montage.soleiljaune.be;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name montage.soleiljaune.be;

    ssl_certificate /etc/letsencrypt/live/montage.soleiljaune.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/montage.soleiljaune.be/privkey.pem;

    # Fichiers envoyés depuis le téléphone ou l'ordinateur : jusqu'à 4 Go chacun.
    client_max_body_size 5G;

    location / {
        proxy_pass http://127.0.0.1:3013;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Envois et lectures de vidéos sans tampon ni coupure.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
